<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="Archivo, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0 0 L6.5 3 L0 6" fill="none" stroke="#9AA0B2" stroke-width="1.3"/>
    </marker>
    <marker id="aA" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0 0 L6.5 3 L0 6" fill="none" stroke="#36457C" stroke-width="1.4"/>
    </marker>
  </defs>
  <!-- input -->
  <rect x="22" y="176" width="216" height="118" rx="12" fill="#EEF0F6" stroke="#DADDE8"/>
  <text x="130" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#17181C">Entité annotée</text>
  <text x="130" y="230" text-anchor="middle" font-size="12.5" fill="#55565F">5 métriques de corpus</text>
  <text x="130" y="258" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, monospace" fill="#36457C">Te · He · Ye</text>
  <text x="130" y="276" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, monospace" fill="#36457C">Re · Feas</text>

  <!-- decision 1 -->
  <rect x="312" y="70" width="268" height="96" rx="12" fill="#FFFFFF" stroke="#36457C" stroke-width="1.6"/>
  <text x="446" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#17181C">Règle fiable&#160;?</text>
  <text x="446" y="122" text-anchor="middle" font-size="11.5" fill="#55565F">motif + vocabulaire stable, ou mots-clés</text>
  <text x="446" y="140" text-anchor="middle" font-size="11.5" fill="#55565F">discriminants — et risque de négation sûr</text>

  <!-- decision 2 -->
  <rect x="312" y="256" width="268" height="90" rx="12" fill="#FFFFFF" stroke="#C7CBDA" stroke-width="1.4"/>
  <text x="446" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#17181C">Assez d'exemples annotés&#160;?</text>
  <text x="446" y="312" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, monospace" fill="#55565F">Feas &#8805; &#952;</text>

  <!-- outputs -->
  <rect x="664" y="84" width="168" height="64" rx="12" fill="#36457C"/>
  <text x="748" y="116" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">RULES</text>
  <text x="748" y="135" text-anchor="middle" font-size="10.5" fill="#D7DCEC">auditable · sans GPU</text>

  <rect x="664" y="258" width="168" height="60" rx="12" fill="#FFFFFF" stroke="#C7CBDA" stroke-width="1.4"/>
  <text x="748" y="286" text-anchor="middle" font-size="16" font-weight="700" fill="#17181C">TBM</text>
  <text x="748" y="304" text-anchor="middle" font-size="10.5" fill="#55565F">transformer (DrBERT)</text>

  <rect x="664" y="366" width="168" height="60" rx="12" fill="#FFFFFF" stroke="#D7D9E2" stroke-width="1.3"/>
  <text x="748" y="394" text-anchor="middle" font-size="16" font-weight="700" fill="#3B3D47">LLM</text>
  <text x="748" y="412" text-anchor="middle" font-size="10.5" fill="#8A90A2">dernier recours</text>

  <!-- edges -->
  <path d="M238 220 C280 210 272 140 310 122" fill="none" stroke="#9AA0B2" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- dec1 yes -> rules -->
  <path d="M580 116 H662" fill="none" stroke="#36457C" stroke-width="1.8" marker-end="url(#aA)"/>
  <text x="620" y="106" text-anchor="middle" font-size="11.5" font-weight="600" fill="#36457C">oui</text>
  <!-- dec1 no -> dec2 -->
  <path d="M446 166 V256" fill="none" stroke="#9AA0B2" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="462" y="214" text-anchor="middle" font-size="11.5" fill="#55565F">non</text>
  <!-- dec2 yes -> tbm -->
  <path d="M580 290 H662" fill="none" stroke="#9AA0B2" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="620" y="280" text-anchor="middle" font-size="11.5" fill="#55565F">oui</text>
  <!-- dec2 no -> llm -->
  <path d="M580 320 C624 338 620 378 662 392" fill="none" stroke="#9AA0B2" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="602" y="372" text-anchor="middle" font-size="11.5" fill="#55565F">non</text>
</svg>
